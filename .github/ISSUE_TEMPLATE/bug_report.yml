name: Bug report
description: Report a problem with MDView.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: MDView version
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system and package
      placeholder: Windows 11, setup.exe / Ubuntu 24.04, .deb
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps and expected result
      description: Explain how to reproduce the problem and what should happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: Include errors and a minimal Markdown example. Remove private information.
    validations:
      required: true
