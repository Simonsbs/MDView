<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' mdview: https: http: data:; font-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'; frame-src 'none'">
  <title>MDView</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="toolbar">
    <button id="open-file" type="button" title="Open a Markdown file (Ctrl+O)">
      <svg viewBox="0 0 20 20" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2.5 6v-2h5l2 2h8v2M2.5 6v10h13l2-8h-13z" stroke-linejoin="round"/></svg>
      Open file
    </button>
    <span id="file-name" class="file-name">MDView</span>
    <span id="watch-status" class="watch-status" role="status" hidden><span class="status-dot"></span><span id="watch-label">Live</span></span>
    <div class="view-controls" role="group" aria-label="Reading appearance">
      <div class="width-control">
        <label for="reading-width">Width</label>
        <input id="reading-width" type="range" min="20" max="100" step="1" value="80" aria-label="Reading width" title="Reading width: 20% to 100% of the window">
        <output id="width-level" for="reading-width">80%</output>
      </div>
      <button id="theme-toggle" type="button" role="switch" aria-checked="false" title="Switch to dark mode">
        Dark mode <span class="theme-track" aria-hidden="true"></span>
      </button>
      <span class="zoom-hint" title="Hold Ctrl and scroll to resize the text">Ctrl + scroll <output id="zoom-level" aria-label="Text size">100%</output></span>
    </div>
  </header>
  <div id="notice" class="notice" role="alert" hidden></div>
  <main id="reader" tabindex="0" aria-label="Markdown document">
    <div id="empty-state" class="empty-state">
      <svg class="document-icon" width="54" height="64" viewBox="0 0 54 64" fill="none" aria-hidden="true"><path d="M11 2h21l13 13v43a4 4 0 0 1-4 4H11a4 4 0 0 1-4-4V6a4 4 0 0 1 4-4Z" stroke="currentColor" stroke-width="1.5"/><path d="M31 2v14h14M16 32h20M16 40h20M16 48h13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <h1>Open a Markdown file</h1>
      <p>Drop a file here, or use <strong>Open file</strong>.</p>
      <p class="empty-note">Changes appear automatically as you save.</p>
    </div>
    <article id="markdown" class="markdown" hidden></article>
    <p id="empty-file" class="empty-file" hidden>This file is empty.</p>
  </main>
  <div id="drop-overlay" class="drop-overlay" hidden>Drop your Markdown file</div>
  <script src="renderer.js"></script>
</body>
</html>
